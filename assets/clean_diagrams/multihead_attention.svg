<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="720" viewBox="0 0 1360 720">
  <style>
    .title { font: 700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#111827; }
    .panel-title { font: 700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#1f2937; }
    .label { font: 700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#374151; }
    .small { font: 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#4b5563; }
    .panel { fill:#ffffff; stroke:#d1d5db; stroke-width:1.5; rx:16; }
    .word { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1.2; rx:7; }
    .focus { fill:#fef3c7; stroke:#d97706; stroke-width:1.8; rx:7; }
    .strong1 { stroke:#2563eb; stroke-width:4; fill:none; }
    .strong2 { stroke:#7c3aed; stroke-width:3; fill:none; }
    .weak { stroke:#cbd5e1; stroke-width:1.4; fill:none; }
    .input { fill:#dbeafe; stroke:#2563eb; stroke-width:1.5; rx:10; }
    .proj { fill:#ede9fe; stroke:#7c3aed; stroke-width:1.6; rx:10; }
    .head1 { fill:#dcfce7; stroke:#16a34a; stroke-width:1.6; rx:10; }
    .head2 { fill:#ffedd5; stroke:#ea580c; stroke-width:1.6; rx:10; }
    .head3 { fill:#fce7f3; stroke:#db2777; stroke-width:1.6; rx:10; }
    .concat { fill:#fef3c7; stroke:#d97706; stroke-width:1.6; rx:10; }
    .output { fill:#f8fafc; stroke:#64748b; stroke-width:1.5; rx:10; }
    .arrow { stroke:#64748b; stroke-width:1.8; fill:none; marker-end:url(#arrow); }
    .branch1 { stroke:#16a34a; stroke-width:1.8; fill:none; marker-end:url(#arrowGreen); }
    .branch2 { stroke:#ea580c; stroke-width:1.8; fill:none; marker-end:url(#arrowOrange); }
    .branch3 { stroke:#db2777; stroke-width:1.8; fill:none; marker-end:url(#arrowPink); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowPink" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#db2777"/>
    </marker>
  </defs>

  <rect width="1360" height="720" fill="#f8fafc"/>
  <text x="680" y="38" text-anchor="middle" class="title">Multi-head attention learns several relationships in parallel</text>

  <!-- Attention interpretation -->
  <g transform="translate(25,70)">
    <rect class="panel" x="0" y="0" width="610" height="600"/>
    <text x="305" y="32" text-anchor="middle" class="panel-title">A. One query can attend to different context clues</text>

    <g transform="translate(65,95)">
      <rect class="word" x="0" y="0" width="75" height="42"/><text x="37" y="26" text-anchor="middle" class="label">The</text>
      <rect class="word" x="82" y="0" width="90" height="42"/><text x="127" y="26" text-anchor="middle" class="label">animal</text>
      <rect class="word" x="179" y="0" width="85" height="42"/><text x="221" y="26" text-anchor="middle" class="label">didn't</text>
      <rect class="word" x="271" y="0" width="70" height="42"/><text x="306" y="26" text-anchor="middle" class="label">cross</text>
      <rect class="word" x="348" y="0" width="70" height="42"/><text x="383" y="26" text-anchor="middle" class="label">the</text>
      <rect class="word" x="425" y="0" width="90" height="42"/><text x="470" y="26" text-anchor="middle" class="label">street</text>

      <rect class="word" x="38" y="90" width="95" height="42"/><text x="85" y="116" text-anchor="middle" class="label">because</text>
      <rect class="focus" x="145" y="90" width="70" height="42"/><text x="180" y="116" text-anchor="middle" class="label">it</text>
      <rect class="word" x="227" y="90" width="70" height="42"/><text x="262" y="116" text-anchor="middle" class="label">was</text>
      <rect class="word" x="309" y="90" width="70" height="42"/><text x="344" y="116" text-anchor="middle" class="label">too</text>
      <rect class="word" x="391" y="90" width="95" height="42"/><text x="438" y="116" text-anchor="middle" class="label">tired</text>

      <path class="strong1" d="M180,90 C180,50 127,55 127,42"/>
      <path class="strong2" d="M180,90 C250,50 430,60 470,42"/>
      <path class="weak" d="M180,90 C260,65 330,70 306,42"/>
      <path class="weak" d="M180,90 C155,60 120,65 85,132"/>

      <text x="115" y="185" class="label" fill="#2563eb">head 1</text>
      <text x="115" y="207" class="small">tracks the likely subject</text>
      <line class="strong1" x1="45" y1="178" x2="95" y2="178"/>

      <text x="355" y="185" class="label" fill="#7c3aed">head 2</text>
      <text x="355" y="207" class="small">captures another relation</text>
      <line class="strong2" x1="285" y1="178" x2="335" y2="178"/>
    </g>

    <rect class="output" x="85" y="390" width="440" height="110"/>
    <text x="305" y="420" text-anchor="middle" class="label">attention output for the word “it”</text>
    <text x="305" y="449" text-anchor="middle" class="small">weighted combination of value vectors from the sentence</text>
    <text x="305" y="476" text-anchor="middle" class="small">different heads can emphasize syntax, reference, distance, or other patterns</text>

    <text x="305" y="545" text-anchor="middle" class="small">The exact interpretation of a head is learned, not predefined.</text>
  </g>

  <!-- Multi-head computation -->
  <g transform="translate(660,70)">
    <rect class="panel" x="0" y="0" width="675" height="600"/>
    <text x="337" y="32" text-anchor="middle" class="panel-title">B. Parallel projected attention heads</text>

    <rect class="input" x="35" y="250" width="125" height="80"/>
    <text x="97" y="278" text-anchor="middle" class="label">sequence X</text>
    <text x="97" y="301" text-anchor="middle" class="small">model dimension</text>

    <rect class="proj" x="210" y="95" width="135" height="64"/>
    <text x="277" y="121" text-anchor="middle" class="label">Q¹, K¹, V¹</text>
    <text x="277" y="144" text-anchor="middle" class="small">head 1 projection</text>

    <rect class="proj" x="210" y="250" width="135" height="64"/>
    <text x="277" y="276" text-anchor="middle" class="label">Q², K², V²</text>
    <text x="277" y="299" text-anchor="middle" class="small">head 2 projection</text>

    <rect class="proj" x="210" y="405" width="135" height="64"/>
    <text x="277" y="431" text-anchor="middle" class="label">Qᴴ, Kᴴ, Vᴴ</text>
    <text x="277" y="454" text-anchor="middle" class="small">head H projection</text>

    <rect class="head1" x="395" y="95" width="150" height="64"/>
    <text x="470" y="121" text-anchor="middle" class="label">attention head 1</text>
    <text x="470" y="144" text-anchor="middle" class="small">softmax(QKᵀ / √dₖ)V</text>

    <rect class="head2" x="395" y="250" width="150" height="64"/>
    <text x="470" y="276" text-anchor="middle" class="label">attention head 2</text>
    <text x="470" y="299" text-anchor="middle" class="small">different learned subspace</text>

    <rect class="head3" x="395" y="405" width="150" height="64"/>
    <text x="470" y="431" text-anchor="middle" class="label">attention head H</text>
    <text x="470" y="454" text-anchor="middle" class="small">another relation pattern</text>

    <rect class="concat" x="575" y="230" width="75" height="110"/>
    <text x="612" y="270" text-anchor="middle" class="label">concat</text>
    <text x="612" y="294" text-anchor="middle" class="small">heads</text>
    <text x="612" y="318" text-anchor="middle" class="small">1 … H</text>

    <rect class="output" x="555" y="390" width="115" height="70"/>
    <text x="612" y="416" text-anchor="middle" class="label">Wᴼ</text>
    <text x="612" y="439" text-anchor="middle" class="small">output projection</text>

    <line class="arrow" x1="160" y1="290" x2="206" y2="127"/>
    <line class="arrow" x1="160" y1="290" x2="206" y2="282"/>
    <line class="arrow" x1="160" y1="290" x2="206" y2="437"/>

    <line class="branch1" x1="345" y1="127" x2="391" y2="127"/>
    <line class="branch2" x1="345" y1="282" x2="391" y2="282"/>
    <line class="branch3" x1="345" y1="437" x2="391" y2="437"/>

    <path class="branch1" d="M545,127 C565,127 565,245 575,255"/>
    <line class="branch2" x1="545" y1="282" x2="571" y2="282"/>
    <path class="branch3" d="M545,437 C565,437 565,325 575,315"/>

    <line class="arrow" x1="612" y1="340" x2="612" y2="386"/>

    <text x="337" y="535" text-anchor="middle" class="label">final output returns to the model dimension</text>
    <text x="337" y="560" text-anchor="middle" class="small">heads are concatenated, then mixed by the learned output matrix Wᴼ</text>
  </g>
</svg>
