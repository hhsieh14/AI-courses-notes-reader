<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="680" viewBox="0 0 1320 680">
  <style>
    .title { font: 700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#111827; }
    .subtitle { font: 600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#475569; }
    .panel-title { font: 700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#1f2937; }
    .label { font: 700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#374151; }
    .small { font: 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#4b5563; }
    .panel { fill:#ffffff; stroke:#d1d5db; stroke-width:1.5; rx:16; }
    .axis { stroke:#64748b; stroke-width:1.4; marker-end:url(#arrow); }
    .grid { stroke:#e5e7eb; stroke-width:1; }
    .b1 { stroke:#2563eb; stroke-width:3; fill:none; }
    .b2 { stroke:#ea580c; stroke-width:3; fill:none; }
    .b3 { stroke:#16a34a; stroke-width:3; fill:none; }
    .b4 { stroke:#7c3aed; stroke-width:3; fill:none; }
    .zero { stroke:#dc2626; stroke-width:1.8; stroke-dasharray:6 5; }
    .badge { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1; rx:10; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1320" height="680" fill="#f8fafc"/>
  <text x="660" y="38" text-anchor="middle" class="title">Ridge and lasso coefficient paths</text>
  <text x="660" y="64" text-anchor="middle" class="subtitle">Schematic paths: increasing λ strengthens regularization.</text>

  <!-- Ridge -->
  <g transform="translate(25,95)">
    <rect class="panel" x="0" y="0" width="610" height="500"/>
    <text x="305" y="35" text-anchor="middle" class="panel-title">A. Ridge: smooth shrinkage</text>

    <line class="axis" x1="75" y1="410" x2="550" y2="410"/>
    <line class="axis" x1="75" y1="75" x2="75" y2="450"/>
    <line class="zero" x1="75" y1="300" x2="540" y2="300"/>

    <line class="grid" x1="75" y1="200" x2="540" y2="200"/>
    <line class="grid" x1="75" y1="100" x2="540" y2="100"/>
    <line class="grid" x1="75" y1="400" x2="540" y2="400"/>

    <path class="b1" d="M75,100 C170,135 250,180 330,220 C410,258 480,278 540,289"/>
    <path class="b2" d="M75,175 C170,205 255,235 335,260 C415,280 485,291 540,296"/>
    <path class="b3" d="M75,338 C165,330 250,321 335,314 C420,308 485,304 540,302"/>
    <path class="b4" d="M75,375 C170,354 255,337 340,324 C425,314 490,307 540,303"/>

    <text x="555" y="430" class="label">λ</text>
    <text x="40" y="80" class="label">β</text>
    <text x="500" y="282" class="small">approach zero smoothly</text>

    <rect class="badge" x="125" y="445" width="360" height="34"/>
    <text x="305" y="467" text-anchor="middle" class="label">typically no exact zero at a finite λ</text>
  </g>

  <!-- Lasso -->
  <g transform="translate(685,95)">
    <rect class="panel" x="0" y="0" width="610" height="500"/>
    <text x="305" y="35" text-anchor="middle" class="panel-title">B. Lasso: shrinkage plus selection</text>

    <line class="axis" x1="75" y1="410" x2="550" y2="410"/>
    <line class="axis" x1="75" y1="75" x2="75" y2="450"/>
    <line class="zero" x1="75" y1="300" x2="540" y2="300"/>

    <line class="grid" x1="75" y1="200" x2="540" y2="200"/>
    <line class="grid" x1="75" y1="100" x2="540" y2="100"/>
    <line class="grid" x1="75" y1="400" x2="540" y2="400"/>

    <polyline class="b1" points="75,100 175,165 275,230 370,300 540,300"/>
    <polyline class="b2" points="75,175 170,220 250,260 325,300 540,300"/>
    <polyline class="b3" points="75,338 150,325 220,313 290,300 540,300"/>
    <polyline class="b4" points="75,375 145,350 215,325 285,300 540,300"/>

    <text x="555" y="430" class="label">λ</text>
    <text x="40" y="80" class="label">β</text>
    <text x="382" y="281" class="small">coefficients hit zero</text>
    <text x="382" y="325" class="small">and remain excluded</text>

    <rect class="badge" x="125" y="445" width="360" height="34"/>
    <text x="305" y="467" text-anchor="middle" class="label">exact zeros produce feature selection</text>
  </g>

  <rect class="badge" x="315" y="620" width="690" height="38"/>
  <text x="660" y="644" text-anchor="middle" class="label">Both reduce variance; lasso can also create a sparse model.</text>
</svg>
