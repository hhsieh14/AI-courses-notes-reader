<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760">
  <style>
    .title { font: 700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#111827; }
    .panel-title { font: 700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#1f2937; }
    .label { font: 600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#374151; }
    .small { font: 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#4b5563; }
    .panel { fill:#ffffff; stroke:#d1d5db; stroke-width:1.4; rx:16; }
    .input { fill:#dbeafe; stroke:#2563eb; stroke-width:1.4; }
    .hidden { fill:#dcfce7; stroke:#16a34a; stroke-width:1.4; }
    .output { fill:#ffedd5; stroke:#ea580c; stroke-width:1.4; }
    .active { fill:#7c3aed; stroke:#6d28d9; stroke-width:1.4; }
    .edge { stroke:#94a3b8; stroke-width:1.2; fill:none; }
    .strong { stroke:#7c3aed; stroke-width:2.2; fill:none; }
    .arrow { stroke:#475569; stroke-width:1.8; fill:none; marker-end:url(#arrow); }
    .block { fill:#f8fafc; stroke:#94a3b8; stroke-width:1.3; rx:10; }
    .residual { stroke:#dc2626; stroke-width:2.2; fill:none; marker-end:url(#arrowRed); }
    .legend { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1; rx:10; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1320" height="760" fill="#f8fafc"/>
  <text x="660" y="38" text-anchor="middle" class="title">Temporal convolutional network: causality, dilation, and residual learning</text>

  <!-- Panel A -->
  <g transform="translate(25,72)">
    <rect class="panel" x="0" y="0" width="410" height="620"/>
    <text x="205" y="32" text-anchor="middle" class="panel-title">A. Causal convolution</text>
    <text x="205" y="55" text-anchor="middle" class="small">output at time t can use only xₜ and earlier inputs</text>

    <!-- Layer labels -->
    <text x="36" y="465" class="small">input</text>
    <text x="36" y="365" class="small">hidden 1</text>
    <text x="36" y="265" class="small">hidden 2</text>
    <text x="36" y="165" class="small">output</text>

    <!-- Nodes -->
    <g>
      <!-- x -->
      <circle class="input" cx="105" cy="450" r="10"/>
      <circle class="input" cx="155" cy="450" r="10"/>
      <circle class="input" cx="205" cy="450" r="10"/>
      <circle class="input" cx="255" cy="450" r="10"/>
      <circle class="input" cx="305" cy="450" r="10"/>
      <circle class="input" cx="355" cy="450" r="10"/>

      <!-- hidden1 -->
      <circle class="hidden" cx="105" cy="350" r="10"/>
      <circle class="hidden" cx="155" cy="350" r="10"/>
      <circle class="hidden" cx="205" cy="350" r="10"/>
      <circle class="hidden" cx="255" cy="350" r="10"/>
      <circle class="hidden" cx="305" cy="350" r="10"/>
      <circle class="hidden" cx="355" cy="350" r="10"/>

      <!-- hidden2 -->
      <circle class="hidden" cx="105" cy="250" r="10"/>
      <circle class="hidden" cx="155" cy="250" r="10"/>
      <circle class="hidden" cx="205" cy="250" r="10"/>
      <circle class="hidden" cx="255" cy="250" r="10"/>
      <circle class="hidden" cx="305" cy="250" r="10"/>
      <circle class="hidden" cx="355" cy="250" r="10"/>

      <!-- output -->
      <circle class="output" cx="105" cy="150" r="10"/>
      <circle class="output" cx="155" cy="150" r="10"/>
      <circle class="output" cx="205" cy="150" r="10"/>
      <circle class="output" cx="255" cy="150" r="10"/>
      <circle class="output" cx="305" cy="150" r="10"/>
      <circle class="active" cx="355" cy="150" r="12"/>
    </g>

    <!-- General edges -->
    <g class="edge">
      <line x1="105" y1="440" x2="105" y2="360"/><line x1="105" y1="440" x2="155" y2="360"/>
      <line x1="155" y1="440" x2="155" y2="360"/><line x1="155" y1="440" x2="205" y2="360"/>
      <line x1="205" y1="440" x2="205" y2="360"/><line x1="205" y1="440" x2="255" y2="360"/>
      <line x1="255" y1="440" x2="255" y2="360"/><line x1="255" y1="440" x2="305" y2="360"/>
      <line x1="305" y1="440" x2="305" y2="360"/><line x1="305" y1="440" x2="355" y2="360"/>

      <line x1="105" y1="340" x2="105" y2="260"/><line x1="105" y1="340" x2="155" y2="260"/>
      <line x1="155" y1="340" x2="155" y2="260"/><line x1="155" y1="340" x2="205" y2="260"/>
      <line x1="205" y1="340" x2="205" y2="260"/><line x1="205" y1="340" x2="255" y2="260"/>
      <line x1="255" y1="340" x2="255" y2="260"/><line x1="255" y1="340" x2="305" y2="260"/>
      <line x1="305" y1="340" x2="305" y2="260"/><line x1="305" y1="340" x2="355" y2="260"/>

      <line x1="105" y1="240" x2="105" y2="160"/><line x1="105" y1="240" x2="155" y2="160"/>
      <line x1="155" y1="240" x2="155" y2="160"/><line x1="155" y1="240" x2="205" y2="160"/>
      <line x1="205" y1="240" x2="205" y2="160"/><line x1="205" y1="240" x2="255" y2="160"/>
      <line x1="255" y1="240" x2="255" y2="160"/><line x1="255" y1="240" x2="305" y2="160"/>
      <line x1="305" y1="240" x2="305" y2="160"/><line x1="305" y1="240" x2="355" y2="160"/>
    </g>

    <!-- Highlight receptive field for final output -->
    <g class="strong">
      <line x1="255" y1="440" x2="305" y2="360"/>
      <line x1="305" y1="440" x2="305" y2="360"/>
      <line x1="355" y1="440" x2="355" y2="360"/>
      <line x1="305" y1="340" x2="355" y2="260"/>
      <line x1="355" y1="340" x2="355" y2="260"/>
      <line x1="355" y1="240" x2="355" y2="162"/>
    </g>

    <text x="355" y="490" text-anchor="middle" class="label">xₜ</text>
    <text x="305" y="490" text-anchor="middle" class="small">xₜ₋₁</text>
    <text x="255" y="490" text-anchor="middle" class="small">xₜ₋₂</text>

    <rect class="legend" x="72" y="520" width="266" height="60"/>
    <text x="205" y="544" text-anchor="middle" class="label">causal receptive field</text>
    <text x="205" y="566" text-anchor="middle" class="small">no path comes from a future input</text>
  </g>

  <!-- Panel B -->
  <g transform="translate(455,72)">
    <rect class="panel" x="0" y="0" width="410" height="620"/>
    <text x="205" y="32" text-anchor="middle" class="panel-title">B. Dilated causal convolution</text>
    <text x="205" y="55" text-anchor="middle" class="small">increasing dilation expands context without a wide filter</text>

    <text x="36" y="505" class="small">input</text>
    <text x="36" y="400" class="small">d = 1</text>
    <text x="36" y="295" class="small">d = 2</text>
    <text x="36" y="190" class="small">d = 4</text>
    <text x="36" y="100" class="small">output</text>

    <!-- Nodes at 8 positions -->
    <g>
      <circle class="input" cx="75" cy="490" r="9"/><circle class="input" cx="115" cy="490" r="9"/>
      <circle class="input" cx="155" cy="490" r="9"/><circle class="input" cx="195" cy="490" r="9"/>
      <circle class="input" cx="235" cy="490" r="9"/><circle class="input" cx="275" cy="490" r="9"/>
      <circle class="input" cx="315" cy="490" r="9"/><circle class="input" cx="355" cy="490" r="9"/>

      <circle class="hidden" cx="75" cy="385" r="9"/><circle class="hidden" cx="115" cy="385" r="9"/>
      <circle class="hidden" cx="155" cy="385" r="9"/><circle class="hidden" cx="195" cy="385" r="9"/>
      <circle class="hidden" cx="235" cy="385" r="9"/><circle class="hidden" cx="275" cy="385" r="9"/>
      <circle class="hidden" cx="315" cy="385" r="9"/><circle class="hidden" cx="355" cy="385" r="9"/>

      <circle class="hidden" cx="75" cy="280" r="9"/><circle class="hidden" cx="115" cy="280" r="9"/>
      <circle class="hidden" cx="155" cy="280" r="9"/><circle class="hidden" cx="195" cy="280" r="9"/>
      <circle class="hidden" cx="235" cy="280" r="9"/><circle class="hidden" cx="275" cy="280" r="9"/>
      <circle class="hidden" cx="315" cy="280" r="9"/><circle class="hidden" cx="355" cy="280" r="9"/>

      <circle class="hidden" cx="75" cy="175" r="9"/><circle class="hidden" cx="115" cy="175" r="9"/>
      <circle class="hidden" cx="155" cy="175" r="9"/><circle class="hidden" cx="195" cy="175" r="9"/>
      <circle class="hidden" cx="235" cy="175" r="9"/><circle class="hidden" cx="275" cy="175" r="9"/>
      <circle class="hidden" cx="315" cy="175" r="9"/><circle class="active" cx="355" cy="175" r="11"/>

      <circle class="active" cx="355" cy="90" r="12"/>
    </g>

    <!-- Highlighted path tree -->
    <g class="strong">
      <!-- d=1 -->
      <line x1="315" y1="481" x2="355" y2="394"/>
      <line x1="355" y1="481" x2="355" y2="394"/>
      <!-- d=2 -->
      <line x1="275" y1="376" x2="355" y2="289"/>
      <line x1="355" y1="376" x2="355" y2="289"/>
      <!-- d=4 -->
      <line x1="195" y1="271" x2="355" y2="184"/>
      <line x1="355" y1="271" x2="355" y2="184"/>
      <line x1="355" y1="164" x2="355" y2="102"/>
    </g>

    <!-- light supporting edges -->
    <g class="edge">
      <line x1="275" y1="481" x2="315" y2="394"/>
      <line x1="235" y1="376" x2="315" y2="289"/>
      <line x1="115" y1="271" x2="275" y2="184"/>
      <line x1="315" y1="271" x2="315" y2="184"/>
    </g>

    <rect class="legend" x="61" y="535" width="288" height="56"/>
    <text x="205" y="558" text-anchor="middle" class="label">dilation schedule: 1, 2, 4, …</text>
    <text x="205" y="579" text-anchor="middle" class="small">receptive field grows rapidly with depth</text>
  </g>

  <!-- Panel C -->
  <g transform="translate(885,72)">
    <rect class="panel" x="0" y="0" width="410" height="620"/>
    <text x="205" y="32" text-anchor="middle" class="panel-title">C. Residual TCN block</text>
    <text x="205" y="55" text-anchor="middle" class="small">learn a temporal correction and add the input path</text>

    <rect class="input" x="55" y="276" width="82" height="52" rx="9"/>
    <text x="96" y="307" text-anchor="middle" class="label">input x</text>

    <rect class="block" x="175" y="88" width="180" height="48"/>
    <text x="265" y="117" text-anchor="middle" class="label">dilated causal conv</text>

    <rect class="block" x="175" y="153" width="180" height="48"/>
    <text x="265" y="182" text-anchor="middle" class="label">normalization + ReLU</text>

    <rect class="block" x="175" y="218" width="180" height="48"/>
    <text x="265" y="247" text-anchor="middle" class="label">dropout</text>

    <rect class="block" x="175" y="283" width="180" height="48"/>
    <text x="265" y="312" text-anchor="middle" class="label">dilated causal conv</text>

    <rect class="block" x="175" y="348" width="180" height="48"/>
    <text x="265" y="377" text-anchor="middle" class="label">normalization + ReLU</text>

    <rect class="block" x="175" y="413" width="180" height="48"/>
    <text x="265" y="442" text-anchor="middle" class="label">dropout</text>

    <circle class="output" cx="265" cy="517" r="25"/>
    <text x="265" y="522" text-anchor="middle" class="label">+</text>

    <rect class="output" x="175" y="555" width="180" height="48" rx="9"/>
    <text x="265" y="584" text-anchor="middle" class="label">block output</text>

    <!-- Main flow -->
    <line class="arrow" x1="137" y1="302" x2="171" y2="112"/>
    <line class="arrow" x1="265" y1="136" x2="265" y2="149"/>
    <line class="arrow" x1="265" y1="201" x2="265" y2="214"/>
    <line class="arrow" x1="265" y1="266" x2="265" y2="279"/>
    <line class="arrow" x1="265" y1="331" x2="265" y2="344"/>
    <line class="arrow" x1="265" y1="396" x2="265" y2="409"/>
    <line class="arrow" x1="265" y1="461" x2="265" y2="488"/>
    <line class="arrow" x1="265" y1="542" x2="265" y2="551"/>

    <!-- Residual -->
    <path class="residual" d="M96,328 C96,500 165,517 236,517"/>
    <rect class="legend" x="38" y="390" width="112" height="58"/>
    <text x="94" y="414" text-anchor="middle" class="label">identity path</text>
    <text x="94" y="436" text-anchor="middle" class="small">or 1×1 projection</text>

    <text x="205" y="80" text-anchor="middle" class="small">transformed branch</text>
  </g>

  <text x="660" y="733" text-anchor="middle" class="small">
    TCN context is explicit: choose filter width, dilation schedule, depth, and residual blocks.
  </text>
</svg>
