<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="610" viewBox="0 0 1260 610">
  <style>
    .title { font: 700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#111827; }
    .row-title { font: 700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#1f2937; }
    .label { font: 600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#374151; }
    .small { font: 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#4b5563; }
    .panel { fill:#ffffff; stroke:#d1d5db; stroke-width:1.5; rx:16; }
    .train { fill:#bfdbfe; stroke:#2563eb; stroke-width:1.2; }
    .test { fill:#fed7aa; stroke:#ea580c; stroke-width:1.2; }
    .gap { fill:#e5e7eb; stroke:#9ca3af; stroke-width:1.2; }
    .unused { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1; }
    .warn { fill:#fef2f2; stroke:#dc2626; stroke-width:1.2; rx:10; }
    .good { fill:#f0fdf4; stroke:#16a34a; stroke-width:1.2; rx:10; }
    .axis { stroke:#64748b; stroke-width:1.5; marker-end:url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1260" height="610" fill="#f8fafc"/>
  <text x="630" y="38" text-anchor="middle" class="title">Temporal validation must preserve chronology</text>

  <g transform="translate(28,70)">
    <rect class="panel" x="0" y="0" width="1204" height="145"/>
    <text x="26" y="32" class="row-title">1. Random cross-validation</text>
    <text x="26" y="56" class="small">Training and test observations are mixed across time.</text>

    <g transform="translate(355,30)">
      <rect class="train" x="0" y="28" width="70" height="42"/><text x="35" y="54" text-anchor="middle" class="label">train</text>
      <rect class="test" x="75" y="28" width="70" height="42"/><text x="110" y="54" text-anchor="middle" class="label">test</text>
      <rect class="train" x="150" y="28" width="70" height="42"/><text x="185" y="54" text-anchor="middle" class="label">train</text>
      <rect class="train" x="225" y="28" width="70" height="42"/><text x="260" y="54" text-anchor="middle" class="label">train</text>
      <rect class="test" x="300" y="28" width="70" height="42"/><text x="335" y="54" text-anchor="middle" class="label">test</text>
      <rect class="train" x="375" y="28" width="70" height="42"/><text x="410" y="54" text-anchor="middle" class="label">train</text>
      <rect class="test" x="450" y="28" width="70" height="42"/><text x="485" y="54" text-anchor="middle" class="label">test</text>
      <rect class="train" x="525" y="28" width="70" height="42"/><text x="560" y="54" text-anchor="middle" class="label">train</text>
      <line class="axis" x1="0" y1="94" x2="610" y2="94"/>
      <text x="305" y="117" text-anchor="middle" class="small">time</text>
    </g>

    <rect class="warn" x="995" y="38" width="174" height="70"/>
    <text x="1082" y="63" text-anchor="middle" class="label">Leakage risk</text>
    <text x="1082" y="84" text-anchor="middle" class="small">future observations can</text>
    <text x="1082" y="102" text-anchor="middle" class="small">influence earlier tests</text>
  </g>

  <g transform="translate(28,235)">
    <rect class="panel" x="0" y="0" width="1204" height="155"/>
    <text x="26" y="32" class="row-title">2. Expanding-window evaluation</text>
    <text x="26" y="56" class="small">The training history grows; each test block remains in the future.</text>

    <g transform="translate(355,22)">
      <text x="-14" y="32" text-anchor="end" class="small">fold 1</text>
      <rect class="train" x="0" y="12" width="180" height="28"/>
      <rect class="test" x="185" y="12" width="70" height="28"/>
      <rect class="unused" x="260" y="12" width="335" height="28"/>

      <text x="-14" y="72" text-anchor="end" class="small">fold 2</text>
      <rect class="train" x="0" y="52" width="295" height="28"/>
      <rect class="test" x="300" y="52" width="70" height="28"/>
      <rect class="unused" x="375" y="52" width="220" height="28"/>

      <text x="-14" y="112" text-anchor="end" class="small">fold 3</text>
      <rect class="train" x="0" y="92" width="410" height="28"/>
      <rect class="test" x="415" y="92" width="70" height="28"/>
      <rect class="unused" x="490" y="92" width="105" height="28"/>
      <line class="axis" x1="0" y1="132" x2="610" y2="132"/>
    </g>

    <rect class="good" x="995" y="43" width="174" height="70"/>
    <text x="1082" y="68" text-anchor="middle" class="label">Predictive setup</text>
    <text x="1082" y="89" text-anchor="middle" class="small">train only on data</text>
    <text x="1082" y="107" text-anchor="middle" class="small">available before the test</text>
  </g>

  <g transform="translate(28,410)">
    <rect class="panel" x="0" y="0" width="1204" height="165"/>
    <text x="26" y="32" class="row-title">3. Sliding window with an optional gap</text>
    <text x="26" y="56" class="small">A fixed-length training window moves forward; a gap can reduce near-boundary dependence.</text>

    <g transform="translate(355,22)">
      <text x="-14" y="32" text-anchor="end" class="small">fold 1</text>
      <rect class="train" x="0" y="12" width="190" height="28"/>
      <rect class="gap" x="195" y="12" width="35" height="28"/>
      <rect class="test" x="235" y="12" width="70" height="28"/>
      <rect class="unused" x="310" y="12" width="285" height="28"/>

      <text x="-14" y="72" text-anchor="end" class="small">fold 2</text>
      <rect class="unused" x="0" y="52" width="90" height="28"/>
      <rect class="train" x="95" y="52" width="190" height="28"/>
      <rect class="gap" x="290" y="52" width="35" height="28"/>
      <rect class="test" x="330" y="52" width="70" height="28"/>
      <rect class="unused" x="405" y="52" width="190" height="28"/>

      <text x="-14" y="112" text-anchor="end" class="small">fold 3</text>
      <rect class="unused" x="0" y="92" width="185" height="28"/>
      <rect class="train" x="190" y="92" width="190" height="28"/>
      <rect class="gap" x="385" y="92" width="35" height="28"/>
      <rect class="test" x="425" y="92" width="70" height="28"/>
      <rect class="unused" x="500" y="92" width="95" height="28"/>
      <line class="axis" x1="0" y1="132" x2="610" y2="132"/>
    </g>

    <g transform="translate(995,44)">
      <rect class="train" x="0" y="0" width="28" height="20"/><text x="38" y="15" class="small">train</text>
      <rect class="gap" x="0" y="30" width="28" height="20"/><text x="38" y="45" class="small">gap</text>
      <rect class="test" x="0" y="60" width="28" height="20"/><text x="38" y="75" class="small">test</text>
    </g>
  </g>
</svg>
