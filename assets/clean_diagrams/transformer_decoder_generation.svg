<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="720" viewBox="0 0 1320 720">
  <style>
    .title { font: 700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#111827; }
    .panel-title { font: 700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#1f2937; }
    .label { font: 700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#374151; }
    .small { font: 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#4b5563; }
    .panel { fill:#ffffff; stroke:#d1d5db; stroke-width:1.5; rx:16; }
    .input { fill:#dbeafe; stroke:#2563eb; stroke-width:1.6; rx:10; }
    .masked { fill:#ede9fe; stroke:#7c3aed; stroke-width:1.8; rx:12; }
    .cross { fill:#fef3c7; stroke:#d97706; stroke-width:1.8; rx:12; }
    .ffn { fill:#dcfce7; stroke:#16a34a; stroke-width:1.8; rx:12; }
    .output { fill:#ffedd5; stroke:#ea580c; stroke-width:1.7; rx:10; }
    .memory { fill:#f8fafc; stroke:#64748b; stroke-width:1.5; rx:10; }
    .arrow { stroke:#64748b; stroke-width:1.9; fill:none; marker-end:url(#arrow); }
    .loop { stroke:#7c3aed; stroke-width:2.2; fill:none; marker-end:url(#arrowPurple); }
    .memoryArrow { stroke:#d97706; stroke-width:2.2; fill:none; marker-end:url(#arrowOrange); }
    .token { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1.2; rx:7; }
    .known { fill:#dcfce7; stroke:#16a34a; stroke-width:1.4; rx:7; }
    .future { fill:#fee2e2; stroke:#dc2626; stroke-width:1.4; rx:7; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1320" height="720" fill="#f8fafc"/>
  <text x="660" y="38" text-anchor="middle" class="title">Transformer decoder: masked context, encoder context, and autoregressive output</text>

  <!-- Decoder block -->
  <g transform="translate(25,70)">
    <rect class="panel" x="0" y="0" width="610" height="600"/>
    <text x="305" y="32" text-anchor="middle" class="panel-title">A. One decoder block</text>

    <rect class="input" x="185" y="505" width="240" height="58"/>
    <text x="305" y="530" text-anchor="middle" class="label">shifted output prefix</text>
    <text x="305" y="552" text-anchor="middle" class="small">BOS, y₁, …, yₜ₋₁</text>

    <rect class="masked" x="165" y="405" width="280" height="68"/>
    <text x="305" y="432" text-anchor="middle" class="label">masked self-attention</text>
    <text x="305" y="455" text-anchor="middle" class="small">cannot attend to current or future target positions</text>

    <rect class="cross" x="165" y="285" width="280" height="72"/>
    <text x="305" y="313" text-anchor="middle" class="label">encoder-decoder attention</text>
    <text x="305" y="337" text-anchor="middle" class="small">decoder Q attends to encoder K and V</text>

    <rect class="ffn" x="165" y="175" width="280" height="68"/>
    <text x="305" y="202" text-anchor="middle" class="label">position-wise feed-forward</text>
    <text x="305" y="225" text-anchor="middle" class="small">independent transformation per decoder position</text>

    <rect class="output" x="185" y="75" width="240" height="58"/>
    <text x="305" y="100" text-anchor="middle" class="label">linear output + softmax</text>
    <text x="305" y="122" text-anchor="middle" class="small">next-token or numerical prediction</text>

    <rect class="memory" x="455" y="270" width="120" height="100"/>
    <text x="515" y="300" text-anchor="middle" class="label">encoder</text>
    <text x="515" y="322" text-anchor="middle" class="label">memory</text>
    <text x="515" y="346" text-anchor="middle" class="small">all input positions</text>

    <line class="arrow" x1="305" y1="505" x2="305" y2="477"/>
    <line class="arrow" x1="305" y1="405" x2="305" y2="361"/>
    <line class="arrow" x1="305" y1="285" x2="305" y2="247"/>
    <line class="arrow" x1="305" y1="175" x2="305" y2="137"/>
    <line class="memoryArrow" x1="455" y1="320" x2="449" y2="320"/>

    <text x="305" y="585" text-anchor="middle" class="small">residual connections and normalization surround each sublayer</text>
  </g>

  <!-- Generation -->
  <g transform="translate(660,70)">
    <rect class="panel" x="0" y="0" width="635" height="600"/>
    <text x="318" y="32" text-anchor="middle" class="panel-title">B. Autoregressive generation</text>

    <text x="45" y="85" class="label">decoder prefix at step 1</text>
    <rect class="known" x="50" y="105" width="80" height="42"/>
    <text x="90" y="131" text-anchor="middle" class="label">BOS</text>
    <rect class="output" x="205" y="105" width="110" height="42"/>
    <text x="260" y="131" text-anchor="middle" class="label">predict y₁</text>
    <line class="arrow" x1="130" y1="126" x2="201" y2="126"/>

    <text x="45" y="210" class="label">decoder prefix at step 2</text>
    <rect class="known" x="50" y="230" width="80" height="42"/>
    <text x="90" y="256" text-anchor="middle" class="label">BOS</text>
    <rect class="known" x="140" y="230" width="80" height="42"/>
    <text x="180" y="256" text-anchor="middle" class="label">y₁</text>
    <rect class="output" x="295" y="230" width="110" height="42"/>
    <text x="350" y="256" text-anchor="middle" class="label">predict y₂</text>
    <line class="arrow" x1="220" y1="251" x2="291" y2="251"/>

    <text x="45" y="335" class="label">decoder prefix at step 3</text>
    <rect class="known" x="50" y="355" width="80" height="42"/>
    <text x="90" y="381" text-anchor="middle" class="label">BOS</text>
    <rect class="known" x="140" y="355" width="80" height="42"/>
    <text x="180" y="381" text-anchor="middle" class="label">y₁</text>
    <rect class="known" x="230" y="355" width="80" height="42"/>
    <text x="270" y="381" text-anchor="middle" class="label">y₂</text>
    <rect class="output" x="385" y="355" width="110" height="42"/>
    <text x="440" y="381" text-anchor="middle" class="label">predict y₃</text>
    <line class="arrow" x1="310" y1="376" x2="381" y2="376"/>

    <path class="loop" d="M260,147 C260,180 180,185 180,226"/>
    <path class="loop" d="M350,272 C350,305 270,310 270,351"/>

    <rect class="memory" x="470" y="90" width="125" height="165"/>
    <text x="532" y="119" text-anchor="middle" class="label">same encoder</text>
    <text x="532" y="141" text-anchor="middle" class="label">memory used</text>
    <text x="532" y="163" text-anchor="middle" class="label">at every step</text>
    <text x="532" y="195" text-anchor="middle" class="small">source sequence</text>
    <text x="532" y="215" text-anchor="middle" class="small">does not change</text>

    <rect class="future" x="45" y="455" width="550" height="80"/>
    <text x="320" y="483" text-anchor="middle" class="label">training versus inference</text>
    <text x="320" y="507" text-anchor="middle" class="small">training: known shifted targets allow masked parallel computation</text>
    <text x="320" y="528" text-anchor="middle" class="small">inference: append each generated output and run the next step</text>

    <text x="318" y="575" text-anchor="middle" class="small">generation stops at EOS or another stopping rule</text>
  </g>
</svg>
