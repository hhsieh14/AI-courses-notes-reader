<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760">
  <style>
    .title { font: 700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#111827; }
    .subtitle { font: 600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#475569; }
    .card-title { font: 700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#1f2937; }
    .label { font: 700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#374151; }
    .small { font: 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#4b5563; }
    .card { fill:#ffffff; stroke:#d1d5db; stroke-width:1.5; rx:16; }
    .plot { fill:#f8fafc; stroke:#e2e8f0; stroke-width:1.1; rx:10; }
    .axis { stroke:#cbd5e1; stroke-width:1; }
    .scaling { stroke:#2563eb; stroke-width:2.8; fill:none; stroke-linejoin:round; stroke-linecap:round; }
    .wavelet { stroke:#ea580c; stroke-width:2.8; fill:none; stroke-linejoin:round; stroke-linecap:round; }
    .badge { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1; rx:9; }
    .note { fill:#fefce8; stroke:#ca8a04; stroke-width:1.2; rx:12; }
  </style>

  <rect width="1320" height="760" fill="#f8fafc"/>
  <text x="660" y="38" text-anchor="middle" class="title">Wavelet families trade support, smoothness, symmetry, and vanishing moments</text>
  <text x="660" y="64" text-anchor="middle" class="subtitle">Schematic shapes for study—not exact filters or functions from a specific order.</text>

  <!-- Haar -->
  <g transform="translate(25,95)">
    <rect class="card" x="0" y="0" width="305" height="570"/>
    <text x="152" y="35" text-anchor="middle" class="card-title">Haar</text>
    <text x="152" y="60" text-anchor="middle" class="small">shortest and discontinuous</text>

    <rect class="plot" x="25" y="85" width="255" height="130"/>
    <line class="axis" x1="38" y1="170" x2="267" y2="170"/>
    <polyline class="scaling" points="40,170 70,170 70,110 205,110 205,170 265,170"/>
    <text x="50" y="105" class="small">scaling</text>

    <rect class="plot" x="25" y="235" width="255" height="130"/>
    <line class="axis" x1="38" y1="300" x2="267" y2="300"/>
    <polyline class="wavelet" points="40,300 75,300 75,255 145,255 145,345 215,345 215,300 265,300"/>
    <text x="50" y="250" class="small">wavelet</text>

    <rect class="badge" x="35" y="405" width="235" height="36"/>
    <text x="152" y="428" text-anchor="middle" class="label">compact support</text>
    <rect class="badge" x="35" y="451" width="235" height="36"/>
    <text x="152" y="474" text-anchor="middle" class="label">sharp change detection</text>
    <rect class="badge" x="35" y="497" width="235" height="36"/>
    <text x="152" y="520" text-anchor="middle" class="label">low smoothness</text>
  </g>

  <!-- Daubechies -->
  <g transform="translate(345,95)">
    <rect class="card" x="0" y="0" width="305" height="570"/>
    <text x="152" y="35" text-anchor="middle" class="card-title">Daubechies</text>
    <text x="152" y="60" text-anchor="middle" class="small">compact and generally asymmetric</text>

    <rect class="plot" x="25" y="85" width="255" height="130"/>
    <line class="axis" x1="38" y1="170" x2="267" y2="170"/>
    <path class="scaling" d="M40,170 C65,170 70,160 82,146 C97,126 115,92 138,103 C160,114 167,155 187,161 C207,167 229,166 265,170"/>
    <text x="50" y="105" class="small">scaling</text>

    <rect class="plot" x="25" y="235" width="255" height="130"/>
    <line class="axis" x1="38" y1="300" x2="267" y2="300"/>
    <path class="wavelet" d="M40,300 C73,300 82,288 96,265 C111,241 126,248 135,286 C144,324 154,350 169,333 C184,316 188,270 208,269 C226,268 237,296 265,300"/>
    <text x="50" y="250" class="small">wavelet</text>

    <rect class="badge" x="35" y="405" width="235" height="36"/>
    <text x="152" y="428" text-anchor="middle" class="label">more vanishing moments</text>
    <rect class="badge" x="35" y="451" width="235" height="36"/>
    <text x="152" y="474" text-anchor="middle" class="label">smoothness grows by order</text>
    <rect class="badge" x="35" y="497" width="235" height="36"/>
    <text x="152" y="520" text-anchor="middle" class="label">asymmetric shape</text>
  </g>

  <!-- Symlet -->
  <g transform="translate(665,95)">
    <rect class="card" x="0" y="0" width="305" height="570"/>
    <text x="152" y="35" text-anchor="middle" class="card-title">Symlet</text>
    <text x="152" y="60" text-anchor="middle" class="small">near-symmetric compact wavelet</text>

    <rect class="plot" x="25" y="85" width="255" height="130"/>
    <line class="axis" x1="38" y1="170" x2="267" y2="170"/>
    <path class="scaling" d="M40,170 C78,169 91,153 104,128 C119,99 136,91 152,99 C168,91 185,99 200,128 C213,153 226,169 265,170"/>
    <text x="50" y="105" class="small">scaling</text>

    <rect class="plot" x="25" y="235" width="255" height="130"/>
    <line class="axis" x1="38" y1="300" x2="267" y2="300"/>
    <path class="wavelet" d="M40,300 C70,300 85,292 100,270 C115,248 130,254 142,282 C147,293 150,299 152,300 C154,301 157,307 162,318 C174,346 189,352 204,330 C219,308 234,300 265,300"/>
    <text x="50" y="250" class="small">wavelet</text>

    <rect class="badge" x="35" y="405" width="235" height="36"/>
    <text x="152" y="428" text-anchor="middle" class="label">near symmetry</text>
    <rect class="badge" x="35" y="451" width="235" height="36"/>
    <text x="152" y="474" text-anchor="middle" class="label">compact support</text>
    <rect class="badge" x="35" y="497" width="235" height="36"/>
    <text x="152" y="520" text-anchor="middle" class="label">balanced localization</text>
  </g>

  <!-- Coiflet -->
  <g transform="translate(985,95)">
    <rect class="card" x="0" y="0" width="305" height="570"/>
    <text x="152" y="35" text-anchor="middle" class="card-title">Coiflet</text>
    <text x="152" y="60" text-anchor="middle" class="small">near-symmetric with longer support</text>

    <rect class="plot" x="25" y="85" width="255" height="130"/>
    <line class="axis" x1="38" y1="170" x2="267" y2="170"/>
    <path class="scaling" d="M40,170 C62,169 75,166 87,154 C99,142 108,119 122,105 C136,91 151,91 166,105 C180,119 190,142 202,154 C214,166 227,169 265,170"/>
    <text x="50" y="105" class="small">scaling</text>

    <rect class="plot" x="25" y="235" width="255" height="130"/>
    <line class="axis" x1="38" y1="300" x2="267" y2="300"/>
    <path class="wavelet" d="M40,300 C62,299 75,294 88,279 C101,264 113,245 128,254 C142,263 143,291 152,300 C161,309 162,337 176,346 C191,355 203,336 216,321 C229,306 242,301 265,300"/>
    <text x="50" y="250" class="small">wavelet</text>

    <rect class="badge" x="35" y="405" width="235" height="36"/>
    <text x="152" y="428" text-anchor="middle" class="label">near symmetry</text>
    <rect class="badge" x="35" y="451" width="235" height="36"/>
    <text x="152" y="474" text-anchor="middle" class="label">more filter coefficients</text>
    <rect class="badge" x="35" y="497" width="235" height="36"/>
    <text x="152" y="520" text-anchor="middle" class="label">smooth multiresolution analysis</text>
  </g>

  <rect class="note" x="250" y="690" width="820" height="45"/>
  <text x="660" y="718" text-anchor="middle" class="label">No family is universally best: select the support and smoothness that match the temporal structure.</text>
</svg>
