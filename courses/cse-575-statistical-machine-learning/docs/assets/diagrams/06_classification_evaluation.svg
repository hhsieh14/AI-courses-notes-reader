<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Classification evaluation intuition</title>
  <desc id="desc">A confusion matrix with true and false predictions and an ROC graph showing random, moderate, and strong curves.</desc>
  <rect width="1200" height="620" fill="#ffffff"/>

  <text x="48" y="55" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1f2937">Confusion matrix</text>
  <text x="780" y="55" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1f2937">ROC curve</text>

  <text x="330" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#374151">Predicted label</text>
  <text x="265" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#374151">Positive</text>
  <text x="465" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#374151">Negative</text>

  <text x="64" y="305" transform="rotate(-90 64 305)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#374151">Actual label</text>
  <text x="145" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#374151">Positive</text>
  <text x="145" y="405" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#374151">Negative</text>

  <rect x="180" y="165" width="170" height="150" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <rect x="350" y="165" width="170" height="150" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <rect x="180" y="315" width="170" height="150" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <rect x="350" y="315" width="170" height="150" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>

  <text x="265" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">True positive</text>
  <text x="265" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#1e3a8a">TP</text>
  <text x="435" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#991b1b">False negative</text>
  <text x="435" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#991b1b">FN</text>
  <text x="435" y="283" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#991b1b">Type II error</text>

  <text x="265" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#991b1b">False positive</text>
  <text x="265" y="405" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#991b1b">FP</text>
  <text x="265" y="433" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#991b1b">Type I error</text>
  <text x="435" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">True negative</text>
  <text x="435" y="405" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#1e3a8a">TN</text>

  <text x="350" y="520" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#374151">Correct outcomes lie on the blue diagonal.</text>
  <text x="350" y="550" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#374151">Errors lie on the red off-diagonal.</text>

  <line x1="680" y1="500" x2="1120" y2="500" stroke="#111827" stroke-width="3"/>
  <line x1="680" y1="500" x2="680" y2="100" stroke="#111827" stroke-width="3"/>
  <text x="900" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#374151">False-positive rate (1 - specificity)</text>
  <text x="620" y="300" transform="rotate(-90 620 300)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#374151">True-positive rate (sensitivity)</text>

  <line x1="680" y1="500" x2="1120" y2="100" stroke="#6b7280" stroke-width="3" stroke-dasharray="10 10"/>
  <text x="970" y="290" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#4b5563">Random guess</text>

  <path d="M680 500 C745 395 825 300 900 235 C980 170 1050 125 1120 100" fill="none" stroke="#2563eb" stroke-width="5"/>
  <path d="M680 500 C710 250 760 165 845 125 C930 95 1030 95 1120 100" fill="none" stroke="#dc2626" stroke-width="5"/>

  <circle cx="680" cy="100" r="8" fill="#7c3aed"/>
  <text x="700" y="125" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6d28d9">Perfect model</text>
  <text x="920" y="145" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#b91c1c">Larger AUC</text>
  <text x="920" y="225" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">Smaller AUC</text>

  <text x="675" y="525" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5563">0</text>
  <text x="1120" y="525" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5563">1</text>
  <text x="657" y="505" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5563">0</text>
  <text x="657" y="105" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5563">1</text>
</svg>
