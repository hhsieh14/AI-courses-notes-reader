<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390">
  <style>
    .title { font: 700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#111827; }
    .label { font: 700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#1f2937; }
    .small { font: 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#4b5563; }
    .axis { stroke:#9ca3af; stroke-width:1.5; }
    .panel { fill:#fff; stroke:#d1d5db; stroke-width:1.5; rx:14; }
    .stem { stroke:#2563eb; stroke-width:4; }
    .dot { fill:#2563eb; }
    .cut { stroke:#dc2626; stroke-width:2; stroke-dasharray:7 6; }
  </style>
  <rect width="1100" height="390" fill="#f8fafc"/>
  <text x="550" y="35" text-anchor="middle" class="title">How one disturbance persists</text>

  <g transform="translate(35,65)">
    <rect class="panel" x="0" y="0" width="500" height="285"/>
    <text x="250" y="34" text-anchor="middle" class="label">AR: effect propagates and decays</text>
    <line class="axis" x1="60" y1="230" x2="450" y2="230"/>
    <line class="axis" x1="60" y1="70" x2="60" y2="230"/>
    <g>
      <line class="stem" x1="95" y1="230" x2="95" y2="92"/><circle class="dot" cx="95" cy="92" r="6"/>
      <line class="stem" x1="150" y1="230" x2="150" y2="123"/><circle class="dot" cx="150" cy="123" r="6"/>
      <line class="stem" x1="205" y1="230" x2="205" y2="149"/><circle class="dot" cx="205" cy="149" r="6"/>
      <line class="stem" x1="260" y1="230" x2="260" y2="169"/><circle class="dot" cx="260" cy="169" r="6"/>
      <line class="stem" x1="315" y1="230" x2="315" y2="184"/><circle class="dot" cx="315" cy="184" r="6"/>
      <line class="stem" x1="370" y1="230" x2="370" y2="196"/><circle class="dot" cx="370" cy="196" r="6"/>
      <line class="stem" x1="425" y1="230" x2="425" y2="205"/><circle class="dot" cx="425" cy="205" r="6"/>
    </g>
    <text x="250" y="263" text-anchor="middle" class="small">ACF decays gradually across lags</text>
  </g>

  <g transform="translate(565,65)">
    <rect class="panel" x="0" y="0" width="500" height="285"/>
    <text x="250" y="34" text-anchor="middle" class="label">MA(q): effect ends after a finite lag</text>
    <line class="axis" x1="60" y1="230" x2="450" y2="230"/>
    <line class="axis" x1="60" y1="70" x2="60" y2="230"/>
    <line class="stem" x1="105" y1="230" x2="105" y2="92"/><circle class="dot" cx="105" cy="92" r="6"/>
    <line class="stem" x1="175" y1="230" x2="175" y2="132"/><circle class="dot" cx="175" cy="132" r="6"/>
    <line class="stem" x1="245" y1="230" x2="245" y2="168"/><circle class="dot" cx="245" cy="168" r="6"/>
    <line class="cut" x1="285" y1="72" x2="285" y2="232"/>
    <circle cx="330" cy="230" r="4" fill="#9ca3af"/><circle cx="385" cy="230" r="4" fill="#9ca3af"/><circle cx="435" cy="230" r="4" fill="#9ca3af"/>
    <text x="292" y="92" class="small">cutoff after q</text>
    <text x="250" y="263" text-anchor="middle" class="small">ACF is zero beyond the model order</text>
  </g>
</svg>
