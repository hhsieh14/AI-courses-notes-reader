<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="470" viewBox="0 0 1160 470">
  <style>
    .title { font: 700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#111827; }
    .panel-title { font: 700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#1f2937; }
    .label { font: 600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#374151; }
    .small { font: 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#4b5563; }
    .panel { fill:#ffffff; stroke:#d1d5db; stroke-width:1.5; rx:16; }
    .cluster1 { fill:#dbeafe; fill-opacity:.72; stroke:#2563eb; stroke-width:2.5; }
    .cluster2 { fill:#ffedd5; fill-opacity:.72; stroke:#ea580c; stroke-width:2.5; }
    .c1 { fill:#2563eb; }
    .c2 { fill:#ea580c; }
    .point { fill:#111827; stroke:#ffffff; stroke-width:3; }
    .soft1 { stroke:#2563eb; stroke-width:3; stroke-dasharray:8 6; }
    .soft2 { stroke:#ea580c; stroke-width:2; stroke-dasharray:6 6; }
    .hard { stroke:#2563eb; stroke-width:4; }
    .muted { stroke:#9ca3af; stroke-width:1.5; stroke-dasharray:5 6; }
    .badge { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1; rx:10; }
  </style>

  <rect width="1160" height="470" fill="#f8fafc"/>
  <text x="580" y="37" text-anchor="middle" class="title">Soft and hard cluster assignments</text>

  <g transform="translate(28,68)">
    <rect class="panel" x="0" y="0" width="535" height="360"/>
    <text x="268" y="36" text-anchor="middle" class="panel-title">Gaussian mixture: soft responsibility</text>

    <ellipse class="cluster1" cx="205" cy="185" rx="132" ry="86" transform="rotate(-12 205 185)"/>
    <ellipse class="cluster2" cx="334" cy="184" rx="128" ry="82" transform="rotate(14 334 184)"/>

    <circle class="c1" cx="165" cy="180" r="9"/>
    <circle class="c2" cx="375" cy="182" r="9"/>
    <text x="140" y="162" class="label">μ₁</text>
    <text x="390" y="162" class="label">μ₂</text>

    <circle class="point" cx="258" cy="197" r="11"/>
    <text x="252" y="226" class="label">x</text>

    <line class="soft1" x1="258" y1="197" x2="165" y2="180"/>
    <line class="soft2" x1="258" y1="197" x2="375" y2="182"/>

    <rect class="badge" x="84" y="284" width="170" height="46"/>
    <text x="169" y="304" text-anchor="middle" class="label">r₁(x) = 0.75</text>
    <text x="169" y="322" text-anchor="middle" class="small">partial membership</text>

    <rect class="badge" x="282" y="284" width="170" height="46"/>
    <text x="367" y="304" text-anchor="middle" class="label">r₂(x) = 0.25</text>
    <text x="367" y="322" text-anchor="middle" class="small">uncertainty retained</text>
  </g>

  <g transform="translate(596,68)">
    <rect class="panel" x="0" y="0" width="535" height="360"/>
    <text x="268" y="36" text-anchor="middle" class="panel-title">K-means: hard assignment</text>

    <ellipse class="cluster1" cx="205" cy="185" rx="132" ry="86" transform="rotate(-12 205 185)"/>
    <ellipse class="cluster2" cx="334" cy="184" rx="128" ry="82" transform="rotate(14 334 184)"/>

    <circle class="c1" cx="165" cy="180" r="9"/>
    <circle class="c2" cx="375" cy="182" r="9"/>
    <text x="140" y="162" class="label">c₁</text>
    <text x="390" y="162" class="label">c₂</text>

    <circle class="point" cx="258" cy="197" r="11"/>
    <text x="252" y="226" class="label">x</text>

    <line class="hard" x1="258" y1="197" x2="165" y2="180"/>
    <line class="muted" x1="258" y1="197" x2="375" y2="182"/>

    <rect class="badge" x="84" y="284" width="170" height="46"/>
    <text x="169" y="304" text-anchor="middle" class="label">cluster 1 = 1</text>
    <text x="169" y="322" text-anchor="middle" class="small">nearest centroid</text>

    <rect class="badge" x="282" y="284" width="170" height="46"/>
    <text x="367" y="304" text-anchor="middle" class="label">cluster 2 = 0</text>
    <text x="367" y="322" text-anchor="middle" class="small">no partial membership</text>
  </g>

  <text x="580" y="454" text-anchor="middle" class="small">
    Soft assignment represents uncertainty; hard assignment chooses one cluster.
  </text>
</svg>
