<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
  <style>
    .title { font: 700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#111827; }
    .label { font: 600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#1f2937; }
    .small { font: 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#4b5563; }
    .axis { stroke:#9ca3af; stroke-width:1.5; }
    .panel { fill:#ffffff; stroke:#d1d5db; stroke-width:1.5; rx:14; }
    .line { fill:none; stroke:#2563eb; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; }
    .mean { stroke:#6b7280; stroke-width:1.5; stroke-dasharray:6 6; }
  </style>
  <rect width="1100" height="360" fill="#f8fafc"/>
  <text x="550" y="35" text-anchor="middle" class="title">Stationary and nonstationary patterns</text>

  <g transform="translate(25,62)">
    <rect class="panel" x="0" y="0" width="335" height="260"/>
    <text x="168" y="32" text-anchor="middle" class="label">Weakly stationary</text>
    <line class="axis" x1="38" y1="220" x2="305" y2="220"/>
    <line class="axis" x1="38" y1="55" x2="38" y2="220"/>
    <line class="mean" x1="38" y1="138" x2="305" y2="138"/>
    <polyline class="line" points="40,145 56,126 72,151 88,133 104,142 120,119 136,150 152,130 168,146 184,124 200,139 216,153 232,128 248,144 264,121 280,149 302,136"/>
    <text x="168" y="247" text-anchor="middle" class="small">Stable mean and spread</text>
  </g>

  <g transform="translate(383,62)">
    <rect class="panel" x="0" y="0" width="335" height="260"/>
    <text x="168" y="32" text-anchor="middle" class="label">Changing mean</text>
    <line class="axis" x1="38" y1="220" x2="305" y2="220"/>
    <line class="axis" x1="38" y1="55" x2="38" y2="220"/>
    <polyline class="line" points="40,195 56,184 72,191 88,168 104,173 120,156 136,164 152,140 168,146 184,125 200,132 216,108 232,116 248,93 264,101 280,75 302,82"/>
    <text x="168" y="247" text-anchor="middle" class="small">Trend makes the level depend on time</text>
  </g>

  <g transform="translate(741,62)">
    <rect class="panel" x="0" y="0" width="335" height="260"/>
    <text x="168" y="32" text-anchor="middle" class="label">Changing variance</text>
    <line class="axis" x1="38" y1="220" x2="305" y2="220"/>
    <line class="axis" x1="38" y1="55" x2="38" y2="220"/>
    <line class="mean" x1="38" y1="138" x2="305" y2="138"/>
    <polyline class="line" points="40,139 56,136 72,142 88,133 104,145 120,128 136,150 152,119 168,158 184,108 200,168 216,97 232,178 248,84 264,190 280,69 302,205"/>
    <text x="168" y="247" text-anchor="middle" class="small">Spread grows even when the center is stable</text>
  </g>
</svg>
