<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
<title id="title">Bayes decision threshold</title>
<desc id="desc">Course diagram redrawn from the source notes.</desc>
<rect width="100%" height="100%" fill="#ffffff" rx="18"/>
<style>text{font-family:Inter,Arial,sans-serif;fill:#17212b}.t{font-size:28px;font-weight:700}.s{font-size:18px}.xs{font-size:15px}.label{font-size:17px;font-weight:600}.dash{stroke-dasharray:8 7}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17212b"/></marker></defs>
<text x="450" y="42" class="t" text-anchor="middle">Bayes decision rule from the posterior probability</text>
<line x1="90" y1="390" x2="830" y2="390" stroke="#17212b" stroke-width="2" />
<line x1="90" y1="390" x2="90" y2="85" stroke="#17212b" stroke-width="2" />
<text x="835" y="414" class="label" text-anchor="start">x</text>
<text x="66" y="82" class="label" text-anchor="start">η(x)</text>
<line x1="90" y1="238" x2="830" y2="238" stroke="#5f6b76" stroke-width="2" class="dash"/>
<text x="72" y="244" class="label" text-anchor="end">1/2</text>
<path d="M100 350 C220 342, 285 315, 350 285 C420 255, 475 230, 530 188 C610 126, 690 112, 820 102" fill="none" stroke="#2563eb" stroke-width="5"/>
<text x="225" y="205" class="label" text-anchor="middle" fill="#dc2626">predict −1</text>
<text x="660" y="205" class="label" text-anchor="middle" fill="#15803d">predict +1</text>
<line x1="445" y1="390" x2="445" y2="238" stroke="#c2410c" stroke-width="3" class="dash"/>
<text x="445" y="424" class="xs" text-anchor="middle">threshold crossing</text>
<text x="450" y="466" class="s" text-anchor="middle">Disagreement is least costly where η(x) is close to 1/2.</text>
</svg>