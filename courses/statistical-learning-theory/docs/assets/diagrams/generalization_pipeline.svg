<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Generalization proof pipeline</title>
<desc id="desc">Course diagram redrawn from the source notes.</desc>
<rect width="100%" height="100%" fill="#ffffff" rx="18"/>
<style>text{font-family:Inter,Arial,sans-serif;fill:#17212b}.t{font-size:28px;font-weight:700}.s{font-size:18px}.xs{font-size:15px}.label{font-size:17px;font-weight:600}.dash{stroke-dasharray:8 7}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17212b"/></marker></defs>
<text x="450" y="42" class="t" text-anchor="middle">From empirical risk to a uniform generalization bound</text>
<rect x="45" y="105" width="170" height="80" rx="14" fill="#dbeafe" stroke="#17212b" stroke-width="1.8"/>
<text x="130.0" y="153" class="label" text-anchor="middle">Training sample</text>
<rect x="255" y="105" width="170" height="80" rx="14" fill="#dcfce7" stroke="#17212b" stroke-width="1.8"/>
<text x="340.0" y="153" class="label" text-anchor="middle">Empirical risk</text>
<rect x="465" y="105" width="170" height="80" rx="14" fill="#ffedd5" stroke="#17212b" stroke-width="1.8"/>
<text x="550.0" y="153" class="label" text-anchor="middle">Uniform gap</text>
<rect x="675" y="105" width="180" height="80" rx="14" fill="#fee2e2" stroke="#17212b" stroke-width="1.8"/>
<text x="765.0" y="153" class="label" text-anchor="middle">Population risk</text>
<line x1="215" y1="145" x2="255" y2="145" stroke="#17212b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="425" y1="145" x2="465" y2="145" stroke="#17212b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="635" y1="145" x2="675" y2="145" stroke="#17212b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="125" y="270" width="190" height="85" rx="14" fill="#f8fafc" stroke="#d9e0e6" stroke-width="2"/>
<text x="220" y="305" class="label" text-anchor="middle">Ghost sample</text>
<text x="220" y="333" class="xs" text-anchor="middle">symmetrization</text>
<rect x="355" y="270" width="190" height="85" rx="14" fill="#f8fafc" stroke="#d9e0e6" stroke-width="2"/>
<text x="450" y="305" class="label" text-anchor="middle">Rademacher signs</text>
<text x="450" y="333" class="xs" text-anchor="middle">fit-to-noise test</text>
<rect x="585" y="270" width="190" height="85" rx="14" fill="#f8fafc" stroke="#d9e0e6" stroke-width="2"/>
<text x="680" y="305" class="label" text-anchor="middle">Class complexity</text>
<text x="680" y="333" class="xs" text-anchor="middle">𝔯ₙ(ℱ)</text>
<line x1="550" y1="185" x2="300" y2="270" stroke="#17212b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="315" y1="312" x2="355" y2="312" stroke="#17212b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="545" y1="312" x2="585" y2="312" stroke="#17212b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="680" y1="270" x2="560" y2="185" stroke="#17212b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="450" y="410" class="s" text-anchor="middle">The supremum makes the bound valid for the data-dependent learner.</text>
<text x="450" y="455" class="s" text-anchor="middle">Concentration controls fluctuation; complexity controls class richness.</text>
</svg>