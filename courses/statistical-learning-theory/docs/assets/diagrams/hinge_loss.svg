<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
<title id="title">Hinge loss</title>
<desc id="desc">The hinge loss decreases linearly until the signed margin reaches one and is zero afterward.</desc>
<rect width="100%" height="100%" fill="#ffffff" rx="18"/>
<style>text{font-family:Inter,Arial,sans-serif;fill:#17212b}.t{font-size:28px;font-weight:700}.s{font-size:18px}.xs{font-size:15px}.label{font-size:17px;font-weight:600}.dash{stroke-dasharray:8 7}</style>
<text x="450" y="42" class="t" text-anchor="middle">Hinge loss Φ(t)=max{1−t,0}</text>
<line x1="100" y1="400" x2="820" y2="400" stroke="#17212b" stroke-width="2"/>
<line x1="180" y1="425" x2="180" y2="85" stroke="#17212b" stroke-width="2"/>
<text x="810" y="430" class="label" text-anchor="end">margin score t</text>
<text x="155" y="88" class="label">loss</text>
<line x1="180" y1="135" x2="430" y2="400" stroke="#dc2626" stroke-width="6"/>
<line x1="430" y1="400" x2="780" y2="400" stroke="#dc2626" stroke-width="6"/>
<line x1="430" y1="400" x2="430" y2="115" stroke="#5f6b76" stroke-width="2" class="dash"/>
<text x="430" y="430" class="label" text-anchor="middle">1</text>
<text x="305" y="235" class="label" text-anchor="middle">linear penalty</text>
<text x="625" y="375" class="label" text-anchor="middle">zero loss</text>
<text x="450" y="462" class="s" text-anchor="middle">Points with t≥1 satisfy the margin; points with t&lt;1 are penalized.</text>
</svg>