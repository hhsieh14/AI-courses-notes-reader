<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Optimization methods map</title>
<desc id="desc">Course diagram redrawn from the source notes.</desc>
<rect width="100%" height="100%" fill="#ffffff" rx="18"/>
<style>text{font-family:Inter,Arial,sans-serif;fill:#17212b}.t{font-size:28px;font-weight:700}.s{font-size:18px}.xs{font-size:15px}.label{font-size:17px;font-weight:600}.dash{stroke-dasharray:8 7}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17212b"/></marker></defs>
<text x="450" y="42" class="t" text-anchor="middle">Optimization methods used in the course</text>
<rect x="325" y="80" width="250" height="72" rx="14" fill="#dbeafe" stroke="#17212b" stroke-width="2"/>
<text x="450" y="124" class="label" text-anchor="middle">Objective structure</text>
<rect x="55" y="230" width="170" height="130" rx="14" fill="#dcfce7" stroke="#17212b" stroke-width="1.8"/>
<text x="140" y="264" class="xs" text-anchor="middle">Smooth + full gradient</text>
<text x="140" y="302" class="label" text-anchor="middle">Gradient descent</text>
<text x="140" y="334" class="xs" text-anchor="middle">O(1/k)</text>
<line x1="450" y1="152" x2="140" y2="230" stroke="#17212b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="245" y="230" width="170" height="130" rx="14" fill="#dbeafe" stroke="#17212b" stroke-width="1.8"/>
<text x="330" y="264" class="xs" text-anchor="middle">Smooth + momentum</text>
<text x="330" y="302" class="label" text-anchor="middle">Accelerated GD</text>
<text x="330" y="334" class="xs" text-anchor="middle">O(1/k²)</text>
<line x1="450" y1="152" x2="330" y2="230" stroke="#17212b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="435" y="230" width="170" height="130" rx="14" fill="#ffedd5" stroke="#17212b" stroke-width="1.8"/>
<text x="520" y="264" class="xs" text-anchor="middle">Smooth + nonsmooth</text>
<text x="520" y="302" class="label" text-anchor="middle">Proximal GD</text>
<text x="520" y="334" class="xs" text-anchor="middle">O(1/k)</text>
<line x1="450" y1="152" x2="520" y2="230" stroke="#17212b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="625" y="230" width="170" height="130" rx="14" fill="#fee2e2" stroke="#17212b" stroke-width="1.8"/>
<text x="710" y="264" class="xs" text-anchor="middle">Finite sum + samples</text>
<text x="710" y="302" class="label" text-anchor="middle">SGD</text>
<text x="710" y="334" class="xs" text-anchor="middle">noise floor</text>
<line x1="450" y1="152" x2="710" y2="230" stroke="#17212b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="260" y="430" width="380" height="78" rx="14" fill="#f8fafc" stroke="#d9e0e6" stroke-width="2"/>
<text x="450" y="463" class="label" text-anchor="middle">Neural-network analysis</text>
<text x="450" y="490" class="xs" text-anchor="middle">separate prediction-space + NTK analysis</text>

</svg>